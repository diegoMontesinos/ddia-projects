services:
  notes-api:
    build: .
    volumes:
      - ./data:/app/data
    ports:
      - '3000:3000'
    environment:
      - PORT=3000

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - '3001:3000'

volumes:
  grafana-storage:
